name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --silent --show-error --output /dev/null --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 --write-out '%{http_code}\n' https://haulcast-api.onrender.com/api/plan/
