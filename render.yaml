services:
  - type: web
    name: haulcast-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend config.wsgi:application --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: haulcast-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://haulcast.netlify.app
